<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live · Humanoid × MBTI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23003057%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%227%22 fill=%22none%22 stroke=%22%23b9d9eb%22 stroke-width=%223%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%222.5%22 fill=%22%23b3a369%22/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .viz-root {
      --surface-1: #0c1d35;
      --text-primary: #eaf3fa;
      --text-secondary: #9fb6c9;
      --text-muted: #6f879c;
      --series-a: #4a8fd8;  /* left letter of each axis (E/S/T/J) */
      --series-b: #b08d3a;  /* right letter (I/N/F/P) */
      --seq: 74, 143, 216; /* single-hue sequential, as rgb for alpha steps */
    }
    body { overflow-x: hidden; }
    .live { display: grid; grid-template-columns: minmax(300px, 0.95fr) 1.6fr; gap: 28px; padding: 28px 36px; min-height: 100dvh; max-width: 1600px; margin: 0 auto; }
    .left { display: flex; flex-direction: column; gap: 18px; }
    .live h1 { font-size: clamp(26px, 2.6vw, 40px); margin: 0; white-space: normal; }
    .qr { background: #fff; border-radius: 18px; padding: 16px; width: 100%; max-width: min(470px, 50vh); aspect-ratio: 1; }
    .qr svg { width: 100%; height: 100%; display: block; }
    .url { font-size: 15px; color: var(--text-secondary); word-break: break-all; }
    .hero { display: flex; gap: 14px; }
    .hero .tile { flex: 1; background: var(--surface-1); border: 1px solid var(--line); border-radius: 0; padding: 16px 18px; }
    .hero .num { font-size: clamp(44px, 5vw, 76px); font-weight: 800; line-height: 1; color: var(--cb); font-variant-numeric: tabular-nums; }
    .hero .num.gold { color: var(--gold-bright); }
    .hero .cap { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }
    .right { display: grid; grid-template-rows: auto auto; gap: 22px; align-content: start; }
    .panel { background: var(--surface-1); border: 1px solid var(--line); border-radius: 0; padding: 18px 20px; }
    .panel h2 { font-size: 17px; color: var(--text-secondary); font-weight: 600; margin-bottom: 12px; }
    .heat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; border-radius: 0; overflow: hidden; }
    .cell { padding: 14px 10px; min-height: 82px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .cell .k { font-weight: 800; font-size: clamp(16px, 1.5vw, 22px); letter-spacing: 0.03em; }
    .cell .f { font-size: 12px; line-height: 1.3; opacity: 0.85; }
    .cell .n { position: absolute; top: 10px; right: 12px; font-weight: 800; font-size: clamp(20px, 2vw, 30px); font-variant-numeric: tabular-nums; }
    .cell.pop { animation: pop .6s ease-out; }
    @keyframes pop { 0% { box-shadow: inset 0 0 0 3px var(--gold-bright); } 100% { box-shadow: inset 0 0 0 0 transparent; } }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .axisrow { display: grid; grid-template-columns: 70px 1fr 70px; align-items: center; gap: 10px; margin: 12px 0; }
    .axisrow .lab { font-weight: 800; font-size: 18px; color: var(--text-primary); }
    .axisrow .lab small { display: block; font-weight: 500; font-size: 12px; color: var(--text-muted); }
    .axisrow .lab.r { text-align: right; }
    .bar { display: flex; height: 26px; gap: 2px; }
    .bar i { display: block; height: 100%; transition: flex-grow .5s; min-width: 4px; }
    .bar i:first-child { background: var(--series-a); border-radius: 4px 0 0 4px; }
    .bar i:last-child { background: var(--series-b); border-radius: 0 4px 4px 0; }
    .pct { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .pairs { list-style: none; padding: 0; margin: 0; }
    .pairs li { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-size: 15px; }
    .pairs li:first-child { border-top: 0; }
    .pairs li .p { font-weight: 700; letter-spacing: 0.02em; }
    .pairs li .c { font-variant-numeric: tabular-nums; color: var(--text-secondary); }
    .pairs li.on .c { color: var(--gold-bright); font-weight: 800; }
    .notice { font-size: 13px; color: var(--text-muted); }
    .tools { display: flex; gap: 8px; }
    .tools button, .tools a { background: none; border: 1px solid var(--line); color: var(--text-secondary); border-radius: 0; padding: 6px 12px; font-size: 13px; cursor: pointer; text-decoration: none; }
    .cell { cursor: pointer; }
    .robotpanel { display: flex; flex-direction: column; padding-bottom: 0; }
    .liverobot { height: 300px; margin: 0 -20px; border-top: 1px solid var(--line); }
    .liveact { font-size: 14px; color: var(--text-primary); padding: 8px 0 12px; min-height: 1.5em; }
    .liveact b { font-family: var(--mono); color: var(--gold-bright); }
    .panel h2 { font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
    .hero .num, .cell .n, .cell .k, .lnum, .ovtype, .ovcount span, .pairs li .p, .pairs li .c, .axisrow .lab { font-family: var(--mono); }
    .hero .cap, .notice { font-size: 13px; }
    .tools button, .tools a { font-family: var(--mono); font-size: 12px; }
    .qr { border-radius: 4px; }
    .bar i:first-child, .bar i:last-child, .lbar { border-radius: 0 !important; }
    .cell:hover, .cell:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: -2px; }
    .loopview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
    .lcol { background: rgba(var(--seq), 0.08); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
    .lcol.weak { box-shadow: inset 0 0 0 2px var(--gold-bright); }
    .lname { font-weight: 800; font-size: clamp(20px, 2vw, 28px); }
    .lname small { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); }
    .lbarwrap { height: 120px; display: flex; align-items: flex-end; }
    .lbar { width: 100%; background: var(--series-a); border-radius: 4px 4px 0 0; min-height: 4px; transition: height .5s; }
    .lcol.weak .lbar { background: var(--series-b); }
    .lnum { font-size: clamp(32px, 3.2vw, 48px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .lnum small { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-left: 4px; }
    .ltypes { display: flex; flex-wrap: wrap; gap: 4px; }
    .ltypes span { font-size: 12px; color: var(--text-secondary); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font-variant-numeric: tabular-nums; }
    .loopmsg { margin: 12px 2px 0; font-size: 17px; color: var(--text-primary); }
    .loopmsg b { color: var(--gold-bright); }
    .overlay { position: fixed; inset: 0; background: rgba(3, 8, 15, 0.86); display: flex; align-items: center; justify-content: center; padding: 4vh 4vw; z-index: 20; }
    .ovbox { background: var(--surface-1); border: 1px solid var(--line); border-radius: 0; width: min(1200px, 100%); max-height: 92vh; overflow: auto; padding: 36px 44px; position: relative; }
    .ovclose { position: absolute; top: 18px; right: 20px; background: none; border: 1px solid var(--line); color: var(--text-secondary); border-radius: 0; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
    .ovtop { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
    .ovtype { font-size: clamp(64px, 8vw, 120px); font-weight: 800; line-height: 1; color: var(--cb); letter-spacing: 0.03em; }
    .ovnick { color: var(--gold-bright); font-size: clamp(18px, 1.8vw, 26px); font-weight: 600; margin-top: 6px; }
    .ovcount { text-align: right; color: var(--text-secondary); font-size: 16px; }
    .ovcount span { display: block; font-size: clamp(48px, 5vw, 80px); font-weight: 800; color: var(--text-primary); line-height: 1; font-variant-numeric: tabular-nums; }
    .ovfield { font-size: clamp(26px, 2.8vw, 42px); font-weight: 800; margin: 18px 0 14px; line-height: 1.3; }
    .ovstages { display: flex; gap: 8px; margin-bottom: 26px; }
    .ovstages span { padding: 6px 16px; border-radius: 0; background: rgba(var(--seq), 0.12); color: var(--text-secondary); font-weight: 700; font-size: 16px; }
    .ovstages span.on { background: var(--gold); color: #14110a; }
    .ovstrength { font-size: clamp(15px, 1.4vw, 19px); color: var(--text-secondary); margin-top: 6px; max-width: 60ch; }
    .ovmain { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
    .ovviz { border: 1px solid var(--line); }
    .ovrobot { height: min(56vh, 560px); }
    .ovact { font-size: 16px; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--text-primary); }
    .ovfig { margin: 0; border: 1px solid var(--line); background: #fff; }
    .ovfig img { width: 100%; max-height: 200px; object-fit: contain; display: block; }
    .ovfig figcaption { background: var(--surface-1); color: var(--text-secondary); font-family: var(--mono); font-size: 12px; padding: 4px 8px; }
    .ovgrid { display: grid; grid-template-columns: 1fr; gap: 18px; }
    .ovpapers { list-style: none; margin: 0; padding: 0; }
    .ovpapers li { padding: 7px 0; border-top: 1px dashed var(--line); font-size: 15px; line-height: 1.4; }
    .ovpapers li:first-child { border-top: 0; padding-top: 0; }
    .ovpapers a { color: var(--text-primary); text-decoration: none; font-weight: 600; }
    .ovpapers a:hover { color: var(--cb); text-decoration: underline; }
    .ovpapers .pm { display: block; font-family: var(--mono); font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .ovpapers .pm a { font-weight: 400; color: var(--cb); }
    .ovpapers .tag { font-family: var(--mono); font-size: 11px; padding: 1px 6px; margin-right: 6px; border: 1px solid var(--line); color: var(--text-secondary); }
    .ovpapers .tag.new { color: #14110a; background: var(--gold-bright); border-color: var(--gold-bright); }
    .ovgrid h3 { font-size: 15px; color: var(--cb-strong); letter-spacing: 0.04em; margin: 0 0 8px; }
    .ovgrid p { font-size: clamp(17px, 1.6vw, 22px); line-height: 1.6; margin: 0; }
    .ovopp { color: var(--gold-bright); }
    @media (max-width: 900px) { .live { grid-template-columns: 1fr; } .two { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="live viz-root" id="live">
    <section class="left">
      <div class="eyebrow" style="margin:0">Why humanoids need agentic vision</div>
      <h1 id="title"></h1>
      <div class="qr" id="qr" aria-label="QR code"></div>
      <div class="url" id="url"></div>
      <div class="hero">
        <div class="tile"><div class="num" id="total">0</div><div class="cap" id="totalCap"></div></div>
        <div class="tile"><div class="num gold" id="pairCount">0</div><div class="cap" id="pairCap"></div></div>
      </div>
      <div class="notice" id="notice"></div>
      <div class="tools">
        <button type="button" id="langBtn">EN</button>
        <button type="button" id="viewBtn"></button>
        <button type="button" id="tableBtn"></button>
        <a href="admin.html" target="_blank" rel="noopener" id="adminBtn">관리자</a>
      </div>
    </section>
    <section class="right">
      <div class="panel">
        <h2 id="heatTitle"></h2>
        <div class="heat" id="heat" role="table"></div>
      </div>
      <div class="two">
        <div class="panel"><h2 id="axisTitle"></h2><div id="axes"></div></div>
        <div class="panel robotpanel"><h2 id="robotTitle"></h2><div class="robot liverobot" id="liveRobot"><div class="loading">loading 3D…</div></div><div class="liveact" id="liveAct"></div></div>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script type="module" src="js/live.js"></script>
</body>
</html>
